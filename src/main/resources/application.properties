server.port=${GXTODO_PORT:8765}
server.address=${GXTODO_BIND:0.0.0.0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
spring.datasource.url=${GXTODO_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/gxtodo}
spring.datasource.username=${GXTODO_DATABASE_USER:gxtodo}
spring.datasource.password=${GXTODO_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=15000
spring.sql.init.mode=never
gxtodo.minio.endpoint=${GXTODO_MINIO_ENDPOINT:http://127.0.0.1:9000}
gxtodo.minio.access-key=${GXTODO_MINIO_ACCESS_KEY:}
gxtodo.minio.secret-key=${GXTODO_MINIO_SECRET_KEY:}
gxtodo.minio.bucket=${GXTODO_MINIO_BUCKET:gxtodo-media}
gxtodo.migrate-sqlite=${GXTODO_MIGRATE_SQLITE:}
