services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gxtodo
      POSTGRES_USER: gxtodo
      POSTGRES_PASSWORD: ${GXTODO_DATABASE_PASSWORD:?Set database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gxtodo -d gxtodo]
      interval: 5s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: deploy/Dockerfile.minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${GXTODO_MINIO_ACCESS_KEY:?Set MinIO user}
      MINIO_ROOT_PASSWORD: ${GXTODO_MINIO_SECRET_KEY:?Set MinIO password}
      MINIO_BROWSER: 'off'
    volumes:
      - minio-data:/data
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - ${GXTODO_HTTP_BIND:-127.0.0.1}:${GXTODO_HTTP_PORT:-18765}:8765
    environment:
      GXTODO_DATABASE_URL: jdbc:postgresql://postgres:5432/gxtodo
      GXTODO_DATABASE_USER: gxtodo
      GXTODO_DATABASE_PASSWORD: ${GXTODO_DATABASE_PASSWORD}
      GXTODO_MINIO_ENDPOINT: http://minio:9000
      GXTODO_MINIO_ACCESS_KEY: ${GXTODO_MINIO_ACCESS_KEY}
      GXTODO_MINIO_SECRET_KEY: ${GXTODO_MINIO_SECRET_KEY}
volumes:
  postgres-data:
  minio-data:
